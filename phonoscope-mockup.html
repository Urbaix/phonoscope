<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHONOSCOPE Mockup</title>
<!-- Referenz-Mockup aus dem Konzept-Chat. Simulierte Audiodaten, kein Mikro. Nur als Design-Vorlage. -->
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141418;display:flex;justify-content:center;padding:24px 12px;font-family:'VT323',monospace}
.wrap{width:100%;max-width:820px}
.fr{background:#2c2c34;border:2px solid;border-color:#6e6e7c #121216 #121216 #6e6e7c;padding:6px}
.in{border:2px solid;border-color:#121216 #6e6e7c #6e6e7c #121216}
.rb{font-family:'VT323',monospace;font-size:19px;color:#cfd8c4;background:#3b3b46;border:2px solid;border-color:#7a7a88 #15151a #15151a #7a7a88;border-radius:0;padding:3px 6px;cursor:pointer}
.rb.on{border-color:#15151a #7a7a88 #7a7a88 #15151a;color:#7dff6a;background:#30303a}
.sw{width:100%;height:30px;border:2px solid;border-color:#7a7a88 #15151a #15151a #7a7a88;border-radius:0;padding:0;cursor:pointer}
.sw.on{border-color:#15151a #7a7a88 #7a7a88 #15151a;outline:2px solid #7dff6a;outline-offset:-6px}
.lb{font-size:16px;color:#8d94a0;letter-spacing:1px;margin:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.sws{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
</style>
</head>
<body>
<div class="wrap">
<div class="fr">
  <div style="display:flex;align-items:center;gap:6px;background:#1b1b22;padding:2px 6px;margin-bottom:6px">
    <span style="font-size:17px;color:#cfd8c4;letter-spacing:2px">PHONOSCOPE</span>
    <span style="flex:1;height:6px;border-top:1px solid #4a4a56;border-bottom:1px solid #4a4a56"></span>
    <span class="rb" style="font-size:14px;padding:0 5px">_</span><span class="rb" style="font-size:14px;padding:0 5px">x</span>
  </div>
  <div class="in" style="display:flex;justify-content:space-between;align-items:center;background:#0a110a;padding:3px 8px;margin-bottom:6px">
    <span id="lcd" style="font-size:20px;color:#5cff4f;white-space:nowrap;overflow:hidden">BALKEN · TÜRKIS</span>
    <span id="clk" style="font-size:24px;color:#5cff4f">00:00</span>
  </div>
  <div class="in"><canvas id="cv" style="width:100%;height:300px;display:block;background:#050705"></canvas></div>
  <div class="lb">MODUS</div>
  <div id="modes" class="grid">
    <button class="rb" data-m="0">BALKEN</button><button class="rb" data-m="1">WELLE</button>
    <button class="rb" data-m="2">PUNKTE</button><button class="rb" data-m="3">VU ANALOG</button>
    <button class="rb" data-m="4">VU LED</button><button class="rb" data-m="5">UHR</button>
  </div>
  <div class="lb">FARBE</div>
  <div id="themes" class="sws">
    <button class="sw" data-t="0" aria-label="Türkis" style="background:#3ff0d8"></button>
    <button class="sw" data-t="1" aria-label="Bernstein" style="background:#ffb13b"></button>
    <button class="sw" data-t="2" aria-label="Grün-Gelb-Rot" style="background:linear-gradient(90deg,#3bff6a 60%,#ffd23b 60% 82%,#ff3b30 82%)"></button>
    <button class="sw" data-t="3" aria-label="Bunt" style="background:linear-gradient(90deg,#3b7bff,#c63bff,#ff3b5c,#ffd23b,#3bff6a)"></button>
    <button class="sw" data-t="4" aria-label="Glut" style="background:linear-gradient(0deg,#ff7a1a,#ff2e88)"></button>
    <button class="sw" data-t="5" aria-label="Eisweiß" style="background:#e6f2ff"></button>
    <input type="color" id="cp" class="sw" value="#7cff4f" aria-label="Eigene Farbe" style="background:#3b3b46">
  </div>
  <div style="display:flex;justify-content:space-between;font-size:14px;color:#6c7380;margin-top:6px"><span>LINE IN · STEREO</span><span>44.1 KHZ</span></div>
</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),lcd=document.getElementById('lcd'),clk=document.getElementById('clk');
const B=16,S=16,labels=['63','','250','','1k','','4k','','16k'],MN=['BALKEN','WELLE','PUNKTE','VU ANALOG','VU LED','UHR'],TN=['TÜRKIS','BERNSTEIN','GRÜN-ROT','BUNT','GLUT','EISWEISS','EIGENE'];
let theme=0,mode=0,custom='#7cff4f',lv=new Array(B).fill(0),pk=new Array(B).fill(0),pt=new Array(B).fill(0),t=0,vuL=0,vuR=0;
const faces=['#9fd8f5','#ffc06a','#ffd08a','#ffd08a','#ffa860','#f3efe2'],F="'VT323',ui-monospace,monospace";
function size(){const d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);}
size();window.addEventListener('resize',size);
function hx(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function mix(a,b,k){const A=hx(a),C=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(C[i]-v)*k)).join(',')+')';}
function col(b,k){
  if(theme===0)return '#3ff0d8';if(theme===1)return '#ffb13b';
  if(theme===2)return k>0.84?'#ff3b30':k>0.64?'#ffd23b':'#3bff6a';
  if(theme===3)return 'hsl('+((b*47)%360)+',95%,60%)';
  if(theme===4)return mix('#ff7a1a','#ff2e88',k);
  if(theme===5)return '#e6f2ff';return custom;
}
function sim(){
  t+=0.06;const beat=Math.max(0,Math.sin(t*2.2))**6;
  for(let b=0;b<B;b++){
    const v=Math.max(0.05,Math.min(1,0.75-b*0.028+0.18*Math.sin(t*0.7+b*0.9)+0.12*Math.sin(t*1.9+b*2.3)+(b<4?beat*0.35:0)+(Math.random()-0.5)*0.18));
    lv[b]+=(v-lv[b])*(v>lv[b]?0.6:0.15);
    if(lv[b]>=pk[b]){pk[b]=lv[b];pt[b]=25;}else if(pt[b]>0)pt[b]--;else pk[b]=Math.max(0,pk[b]-0.012);
  }
  const avg=lv.reduce((a,c)=>a+c,0)/B;
  vuL+=(Math.min(1.05,avg*1.15+0.05*Math.sin(t*3.1))-vuL)*0.12;
  vuR+=(Math.min(1.05,avg*1.1+0.06*Math.sin(t*2.3+1))-vuR)*0.12;
}
function seg(x,y,w,h,c,on){ctx.fillStyle=c;if(on){ctx.shadowColor=c;ctx.shadowBlur=8;}else{ctx.globalAlpha=0.09;}ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;ctx.shadowBlur=0;}
function vuPos(db){return (Math.pow(10,db/20)-0.1)/(Math.pow(10,3/20)-0.1);}
function rr(x,y,w,h){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,5):ctx.rect(x,y,w,h);}
function meter(x,y,w,h,val,name){
  const fc=theme===6?custom:faces[theme];ctx.save();rr(x,y,w,h);ctx.clip();
  const g=ctx.createRadialGradient(x+w/2,y+h*0.8,5,x+w/2,y+h*0.6,w*0.75);
  g.addColorStop(0,mix(fc,'#ffffff',0.35));g.addColorStop(1,mix(fc,'#2a1a08',0.5));ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  const px=x+w/2,py=y+h*1.35,R=h*1.05,A=0.72,P=(a,r)=>[px+r*Math.sin(a),py-r*Math.cos(a)];
  ctx.strokeStyle='#2b1d10';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(px,py,R,-Math.PI/2-A,-Math.PI/2+A);ctx.stroke();
  ctx.strokeStyle='#c8281e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(px,py,R+3,-Math.PI/2-A+2*A*vuPos(0),-Math.PI/2+A);ctx.stroke();
  ctx.font='15px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
  [-20,-10,-7,-5,-3,-2,-1,0,1,2,3].forEach(db=>{
    const a=-A+2*A*vuPos(db),[x1,y1]=P(a,R),[x2,y2]=P(a,R+8);
    ctx.strokeStyle=db>0?'#c8281e':'#2b1d10';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if([-20,-10,-5,0,3].includes(db)){const [lx,ly]=P(a,R+17);ctx.fillStyle=db>0?'#c8281e':'#2b1d10';ctx.fillText(db>0?'+'+db:String(Math.abs(db)),lx,ly);}
  });
  ctx.fillStyle='#2b1d10';ctx.font='20px '+F;ctx.fillText('VU',x+w-20,y+h-16);ctx.fillText(name,x+14,y+h-16);
  const a=-A+2*A*Math.max(0,Math.min(1.08,val)),[nx,ny]=P(a,R+12);
  ctx.strokeStyle='#151515';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(nx,ny);ctx.stroke();
  ctx.restore();ctx.strokeStyle='#000';ctx.lineWidth=3;rr(x,y,w,h);ctx.stroke();
}
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);
  if(mode===5){
    const d=new Date(),s=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    ctx.font='140px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col(5,0.3);ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;ctx.fillText(s,W/2,H/2-10);ctx.shadowBlur=0;
    ctx.font='24px '+F;ctx.globalAlpha=0.6;ctx.fillText(String(d.getSeconds()).padStart(2,'0')+' SEC',W/2,H/2+64);ctx.globalAlpha=1;return;
  }
  if(mode===3){const gp=12,mw=(W-gp*3)/2;meter(gp,14,mw,H-28,vuL,'L');meter(gp*2+mw,14,mw,H-28,vuR,'R');return;}
  if(mode===4){
    const N=32,x0=30,sw=(W-x0-12)/N;ctx.font='20px '+F;
    [['L',vuL,H*0.3],['R',vuR,H*0.58]].forEach(([n,v,y])=>{
      ctx.fillStyle='#7d8a86';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(n,8,y+14);
      for(let i=0;i<N;i++)seg(x0+i*sw+1,y,sw*0.7,28,col(i,i/(N-1)),i<Math.round(v*N));
    });
    ctx.fillStyle='#7d8a86';ctx.textAlign='center';['-20','-10','-5','0','+3'].forEach((l,i)=>ctx.fillText(l,x0+[0.02,0.3,0.55,0.8,0.97][i]*(W-x0-12),H-16));return;
  }
  const padX=12,top=12,lab=20,gh=H-top-lab,cw=(W-padX*2)/B,bw=cw*0.72,sh=gh/S,sg=sh*0.62,half=S/2;
  for(let b=0;b<B;b++){
    const x=padX+b*cw+(cw-bw)/2,n=Math.round(lv[b]*S),p=Math.min(S-1,Math.round(pk[b]*S));
    for(let s=0;s<S;s++){
      let on,k,y;
      if(mode===1){k=Math.floor(Math.abs(s-(S-1)/2));on=k<lv[b]*half;y=top+s*sh;k=k/(half-1);}
      else{y=top+gh-(s+1)*sh;k=s/(S-1);on=mode===0?(s<n||(s===p&&p>=n)):(s===p||s===n-1);}
      seg(x,y+(sh-sg)/2,bw,sg,col(b,k),on);
    }
  }
  ctx.font='18px '+F;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#7d8a86';
  labels.forEach((l,i)=>{if(l)ctx.fillText(l,padX+(i*2)*cw+cw/2,H-4);});
}
function tick(){const d=new Date();clk.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function loop(){sim();draw();requestAnimationFrame(loop);}
function mark(){
  document.querySelectorAll('#modes .rb').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode));
  document.querySelectorAll('#themes .sw').forEach(b=>b.classList.toggle('on',b.id==='cp'?theme===6:+b.dataset.t===theme));
  lcd.textContent=MN[mode]+' · '+TN[theme];
}
document.getElementById('modes').onclick=e=>{const b=e.target.closest('button');if(b){mode=+b.dataset.m;mark();}};
document.getElementById('themes').onclick=e=>{const b=e.target.closest('button');if(b){theme=+b.dataset.t;mark();}};
document.getElementById('cp').oninput=e=>{custom=e.target.value;theme=6;mark();};
tick();setInterval(tick,1000);mark();loop();
</script>
</body>
</html>
